# In-memory H2 database for tests and for `./mvnw spring-boot:test-run` local demos.
# These credentials exist only on the test classpath and are never packaged into the jar.
spring.datasource.url=jdbc:h2:mem:campus_tracking;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.com.campus.tracking=INFO

app.jwt.secret=test-only-signing-secret-0123456789abcdef
app.bootstrap-admin.email=admin@test.local
app.bootstrap-admin.password=AdminPass123
app.bootstrap-admin.name=Test Admin

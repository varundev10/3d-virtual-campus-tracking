# ---- Server ----
server.port=8080

# ---- Database connection ----
# Defaults to file-based H2 database (persisted in ./data/campus_db) so the project runs out-of-the-box with ZERO setup.
# To switch to MySQL, set SPRING_DATASOURCE_URL or use application-mysql.properties.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/campus_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# ---- Authentication ----
# HS256 signing secret (at least 32 characters)
app.jwt.secret=${APP_JWT_SECRET:campus-tracking-secret-key-32-chars-long-minimum-jwt}
app.jwt.expiry-minutes=${APP_JWT_EXPIRY_MINUTES:480}

# First admin account. Defaults to admin@campus.local / AdminPass123
app.bootstrap-admin.email=${APP_ADMIN_EMAIL:admin@campus.local}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:AdminPass123}
app.bootstrap-admin.name=${APP_ADMIN_NAME:Campus Administrator}

# Comma-separated browser origins allowed to call /api.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- Logging ----
logging.level.org.springframework.web=INFO
logging.level.com.campus.tracking=INFO



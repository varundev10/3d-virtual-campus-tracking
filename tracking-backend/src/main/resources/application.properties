# ---- Server ----
server.port=${PORT:8080}

# ---- PostgreSQL connection ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_tracking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Authentication ----
# HS256 signing secret (at least 32 characters)
app.jwt.secret=${APP_JWT_SECRET:campus-tracking-secret-key-32-chars-long-minimum-jwt}
app.jwt.expiry-minutes=${APP_JWT_EXPIRY_MINUTES:480}

# First admin account. Defaults to admin@campus.local / AdminPass123
app.bootstrap-admin.email=${APP_ADMIN_EMAIL:admin@campus.local}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:AdminPass123}
app.bootstrap-admin.name=${APP_ADMIN_NAME:Campus Administrator}

# Comma-separated browser origins allowed to call /api.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- Campus time ----
# Timetables are written in campus-local time. The server also runs on this zone (see TrackingBackendApplication).
app.campus.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ---- Attendance ----
# Students may arrive this many minutes before a session starts and still be marked present.
app.attendance.early-minutes=${APP_ATTENDANCE_EARLY_MINUTES:10}
# Minutes after a session ends before absentees are finalized as ABSENT or BUNKED.
app.attendance.grace-minutes=${APP_ATTENDANCE_GRACE_MINUTES:5}
app.attendance.sweep-seconds=${APP_ATTENDANCE_SWEEP_SECONDS:60}
# Minimum attendance percentage; students below it are flagged.
app.attendance.required-percent=${APP_ATTENDANCE_REQUIRED_PERCENT:75}

# ---- Anomaly detection ----
# A jump of at least min-jump-meters faster than max-speed-mps between two positions raises an alert.
app.anomaly.max-speed-mps=${APP_ANOMALY_MAX_SPEED_MPS:30}
app.anomaly.min-jump-meters=${APP_ANOMALY_MIN_JUMP_METERS:100}
app.anomaly.cooldown-minutes=${APP_ANOMALY_COOLDOWN_MINUTES:15}

# ---- Crowd monitoring ----
# A person counts as being at a campus place when within this many metres of its marker.
app.crowd.place-radius-meters=${APP_CROWD_PLACE_RADIUS_METERS:60}

# ---- Logging ----
logging.level.org.springframework.web=INFO
logging.level.com.campus.tracking=DEBUG

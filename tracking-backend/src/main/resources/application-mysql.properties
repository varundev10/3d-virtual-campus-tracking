# MySQL Configuration Profile
# Activate by running: .\mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Or setting SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/campus_tracking?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:campus_user}
spring.datasource.password=${MYSQL_PASSWORD:StrongPassword123!}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
